<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="AI Code Archaeologist">
  <title>AI Code Archaeologist</title>
  <style>
    /* Small sizes lose detail, so this variant keeps only the ring and core. */
    .r { transform-origin: 16px 16px; animation: spin 14s linear infinite; }
    .c { transform-origin: 16px 16px; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    @media (prefers-reduced-motion: reduce) { .r, .c { animation: none; } }
  </style>
  <circle class="r" cx="16" cy="16" r="12.5" fill="none" stroke="#38e0d0"
          stroke-opacity=".3" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="6.4" fill="none" stroke="#38e0d0" stroke-width="1.8"/>
  <g stroke="#38e0d0" stroke-width="1.8" stroke-linecap="round" stroke-opacity=".8">
    <path d="M16 1.5v3.5"/><path d="M16 27v3.5"/><path d="M1.5 16h3.5"/><path d="M27 16h3.5"/>
  </g>
  <circle class="c" cx="16" cy="16" r="2.6" fill="#38e0d0"/>
</svg>
